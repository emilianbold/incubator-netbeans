# Builds a NetBeans ZIP in which the converted Platform/Java/Groovy
# modules ship as PURE SOURCE JARs (no compiled classes): the running
# IDE compiles them on demand from the sources in the JARs themselves.
#
# Every successful build publishes the ZIP as a GitHub release on the
# rolling tag source-modules-latest (recreated, so the tag always points
# at the built commit). Push a tag source-modules-v* for a permanent,
# versioned release as well.

name: Source Modules

on:
  workflow_dispatch:
  push:
    branches:
      - 'source-modules'
    tags:
      - 'source-modules-v*'

permissions:
  contents: write

concurrency:
  group: source-modules-${{ github.ref }}
  cancel-in-progress: true

env:
  # full config: platform + java + ide + groovy + harness + ... everything
  CLUSTER_CONFIG: 'full'

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build source-only-modules demo ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:

      - name: Checkout ${{ github.ref }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          problem-matcher: false

      - name: Cache external binaries
        uses: actions/cache@v6
        with:
          path: ~/.hgexternalcache
          key: ${{ runner.os }}-${{ hashFiles('*/external/binaries-list', '*/*/external/binaries-list') }}
          restore-keys: ${{ runner.os }}-

      - name: Build NetBeans (${{ env.CLUSTER_CONFIG }} config)
        run: ant -quiet -Dcluster.config=$CLUSTER_CONFIG build-nozip

      # The built JARs are hybrid (compiled classes plus sources); strip the
      # classes so the distribution ships modules as pure source code and
      # the IDE compiles them from source at runtime.
      - name: Trim compiled classes from source-only module JARs
        run: ant -quiet -Dcluster.config=$CLUSTER_CONFIG trim-source-modules

      - name: Show purely-source JARs
        run: |
          J=nbbuild/netbeans/platform/modules/org-netbeans-modules-favorites.jar
          echo "== contents of $J:"
          unzip -l "$J"
          classes=$(unzip -l "$J" | grep -c '\.class$' || true)
          if [ "$classes" != "0" ]; then
            echo "FAIL: $classes class files found in $J"
            exit 1
          fi
          n=$(for j in nbbuild/netbeans/*/modules/*.jar; do
                c=$(unzip -l "$j" 2>/dev/null | grep -c '\.class$' || true)
                s=$(unzip -l "$j" 2>/dev/null | grep -c '\.java$' || true)
                if [ "$c" = "0" ] && [ "$s" -gt 0 ]; then echo x; fi
              done | wc -l)
          echo "== $n module JARs in this build ship as pure source code"

      - name: ZIP
        run: ant -quiet -Dcluster.config=$CLUSTER_CONFIG zip-cluster-config

      # The harness zip name (NetBeans-<buildnum>-<config>.zip) is cryptic;
      # give the download a friendly name and build the release notes.
      - name: Prepare release
        run: |
          zip=$(ls nbbuild/NetBeans-*.zip)
          rel="nbbuild/netbeans-source-modules-${GITHUB_SHA::7}.zip"
          cp "$zip" "$rel"
          { cat .github/SOURCE-MODULES-INTRO.md
            echo
            echo '---'
            echo
            echo "Built from commit \`$GITHUB_SHA\`, cluster config \`$CLUSTER_CONFIG\`, $(date -u +'%Y-%m-%d %H:%M UTC')."
          } > nbbuild/release-notes.md

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: netbeans-source-modules
          path: nbbuild/netbeans-source-modules-*.zip
          retention-days: 7
          if-no-files-found: error

      # Rolling release: recreated on every build, so the tag always
      # matches the commit the ZIP was built from.
      - name: Publish rolling GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=source-modules-latest
          gh release delete "$tag" --yes --cleanup-tag 2> /dev/null || true
          gh release create "$tag" \
            --title "NetBeans with source-only modules" \
            --notes-file nbbuild/release-notes.md \
            --target "$GITHUB_SHA" \
            nbbuild/netbeans-source-modules-*.zip

      # A versioned tag gets its own permanent release in addition.
      - name: Publish versioned GitHub release (versioned tags only)
        if: startsWith(github.ref, 'refs/tags/source-modules-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "NetBeans with source-only modules ($tag)" \
            --notes-file nbbuild/release-notes.md \
            nbbuild/netbeans-source-modules-*.zip
